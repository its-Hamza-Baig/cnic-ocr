services:
  mysql:
    image: mysql:8.4
    container_name: cnic-ocr-mysql
    restart: unless-stopped
    ports:
      - "${FORWARD_DB_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: cnic_ocr
      MYSQL_USER: cnic
      MYSQL_PASSWORD: cnic
      MYSQL_ROOT_PASSWORD: cnic_root_local
    volumes:
      - cnic-ocr-mysql:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ucnic", "-pcnic"]
      interval: 5s
      timeout: 5s
      retries: 20

  paddleocr:
    build:
      context: ./docker/paddleocr
    image: cnic-ocr-paddleocr
    container_name: cnic-ocr-paddleocr
    restart: unless-stopped
    ports:
      - "${FORWARD_PADDLEOCR_PORT:-8868}:8868"
    environment:
      PADDLEOCR_LANGS: "${PADDLEOCR_LANGS:-en,ar}"
      FLAGS_use_mkldnn: "0"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
    volumes:
      - paddleocr-cache:/root/.paddlex
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8868/health')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 240s

  tesseract:
    build:
      context: ./docker/tesseract
    image: cnic-ocr-tesseract
    profiles: ["ocr"]

volumes:
  cnic-ocr-mysql:
  paddleocr-cache:
